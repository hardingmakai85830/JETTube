name: Build JET Tube IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: List Schemes
      run: xcodebuild -project JETTube.xcodeproj -list

    - name: Build App
      run: |
        xcodebuild \
          -project JETTube.xcodeproj \
          -scheme JETTube \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ENABLE_BITCODE=NO \
          ONLY_ACTIVE_ARCH=NO \
          build

    - name: Create IPA
      run: |
        APP_PATH=$(find build/DerivedData -name "JETTube.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        mkdir -p build/Payload
        cp -r "$APP_PATH" build/Payload/
        cd build
        zip -r JETTube.ipa Payload
        echo "✅ IPA created successfully!"
        ls -la JETTube.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JETTube-IPA
        path: build/JETTube.ipa
        retention-days: 90

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/JETTube.ipa
        generate_release_notes: true
