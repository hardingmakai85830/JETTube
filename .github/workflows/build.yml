name: Build JET Tube IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        xcode-select --print-path
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate
        echo "=== Generated project ==="
        ls -la *.xcodeproj/

    - name: Show Schemes
      run: xcodebuild -project JETTube.xcodeproj -list

    - name: Build (verbose, no signing)
      run: |
        set -o pipefail
        xcodebuild build \
          -project JETTube.xcodeproj \
          -scheme JETTube \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath "$PWD/DerivedData" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ENABLE_BITCODE=NO \
          2>&1 | tee build.log
        echo "=== BUILD EXIT: $? ==="

    - name: Show Build Result
      if: always()
      run: |
        echo "=== DerivedData contents ==="
        find DerivedData -name "*.app" -type d 2>/dev/null || echo "No .app found"
        echo ""
        echo "=== Last 50 lines of build log ==="
        tail -50 build.log 2>/dev/null || echo "No build log"

    - name: Create IPA
      run: |
        APP_PATH=$(find DerivedData -name "JETTube.app" -type d | head -1)
        echo "APP_PATH=$APP_PATH"
        
        if [ -z "$APP_PATH" ]; then
          echo "❌ ERROR: JETTube.app not found!"
          find DerivedData -type d -name "*.app" | head -10
          exit 1
        fi
        
        APP_SIZE=$(du -sh "$APP_PATH" | cut -f1)
        echo "✅ Found app: $APP_PATH ($APP_SIZE)"
        
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r JETTube.ipa Payload/
        rm -rf Payload
        
        IPA_SIZE=$(du -sh JETTube.ipa | cut -f1)
        echo "✅ IPA created: $IPA_SIZE"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: JETTube-unsigned
        path: JETTube.ipa
        retention-days: 90

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
