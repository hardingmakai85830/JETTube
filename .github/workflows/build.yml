name: Build JET Tube IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Debug - List files
      run: |
        echo "=== Root ==="
        ls -la
        echo "=== project.yml ==="
        cat project.yml | head -5

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild \
          -project JETTube.xcodeproj \
          -scheme JETTube \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/JETTube.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""

    - name: Create IPA
      run: |
        mkdir -p build/Payload
        cp -r build/JETTube.xcarchive/Products/Applications/JETTube.app build/Payload/
        cd build
        zip -r JETTube.ipa Payload
        echo "✅ IPA created successfully!"
        ls -la JETTube.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JETTube-IPA
        path: build/JETTube.ipa
        retention-days: 90

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/JETTube.ipa
        generate_release_notes: true
