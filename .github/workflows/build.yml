name: Build JET Tube IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Show Schemes
      run: xcodebuild -project JETTube.xcodeproj -list

    # Step 1: Build for iphoneos — unsigned
    - name: Build for Device (unsigned)
      run: |
        xcodebuild build \
          -project JETTube.xcodeproj \
          -scheme JETTube \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          | xcpretty || true
        
        # Verify build output
        find DerivedData -name "*.app" -type d | head -5

    # Step 2: Package into IPA
    - name: Create IPA
      run: |
        # Find the built .app
        APP_PATH=$(find DerivedData -name "JETTube.app" -path "*/Release-iphoneos/*" | head -1)
        
        if [ -z "$APP_PATH" ]; then
          echo "❌ .app not found in Release-iphoneos, searching all..."
          APP_PATH=$(find DerivedData -name "JETTube.app" -type d | head -1)
        fi
        
        echo "📦 Building IPA from: $APP_PATH"
        
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r JETTube.ipa Payload/
        rm -rf Payload
        
        echo "✅ IPA size: $(du -sh JETTube.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: JETTube-unsigned
        path: JETTube.ipa
        retention-days: 90
